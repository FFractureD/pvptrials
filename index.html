<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PVPTRIALS Rankings</title>
<style>
  :root {
    --bg: #14100e;
    --bg-raised: #1c1714;
    --bg-row: #1a1512;
    --line: #332a24;
    --ink: #ece6dd;
    --ink-dim: #8a857d;
    --accent: #e2572b;
    --gold: #c9a15a;
    --t1: #e2572b;
    --t2: #c9a15a;
    --t3: #8fae6b;
    --t4: #6b96ae;
    --t5: #6b6ea3;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(ellipse at top, rgba(226,87,43,0.07), transparent 60%);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  header {
    padding: 3.5rem 1.5rem 2rem;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-size: clamp(2rem, 5vw, 3.2rem);
    letter-spacing: -0.01em;
    margin: 0 0 0.4rem;
  }
  header h1 span { color: var(--accent); font-style: italic; }
  header p { color: var(--ink-dim); font-size: 0.95rem; margin: 0; max-width: 42ch; margin-inline: auto; }

  main { max-width: 760px; margin: 0 auto; padding: 2rem 1rem 4rem; }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.1rem;
    flex-wrap: wrap;
  }
  .status { display: flex; align-items: center; gap: 0.5rem; color: var(--ink-dim); font-size: 0.8rem; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #4caf50;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(76,175,80,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(76,175,80,0); }
    100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); }
  }
  .search {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 0.5rem 0.8rem;
    border-radius: 8px;
    font-size: 0.85rem;
    min-width: 180px;
  }
  .search::placeholder { color: var(--ink-dim); }
  .search:focus { outline: none; border-color: var(--accent); }

  .card {
    display: grid;
    grid-template-columns: 2.4rem 1fr auto;
    align-items: center;
    column-gap: 1rem;
    row-gap: 0.65rem;
    padding: 0.9rem 1rem;
    background: var(--bg-row);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 0.55rem;
    transition: background .6s ease, border-color .3s ease;
  }
  .card.flash { background: rgba(226,87,43,0.16); border-color: var(--accent); }

  .rank { color: var(--ink-dim); font-variant-numeric: tabular-nums; font-size: 0.9rem; }
  .nick { font-weight: 700; font-size: 1.02rem; }

  .general {
    font-weight: 800;
    font-size: 0.95rem;
    padding: 0.3rem 0.65rem;
    border-radius: 6px;
    text-align: center;
    color: #16110d;
    background: var(--tier-color, var(--gold));
    white-space: nowrap;
  }
  .general small { display: block; font-weight: 600; font-size: 0.62rem; opacity: 0.75; margin-top: 0.05rem; }

  .modes {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    padding-left: 3.4rem;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.22rem 0.6rem 0.22rem 0.5rem;
    font-size: 0.76rem;
  }
  .chip .mode-name { color: var(--ink-dim); }
  .chip .mode-tier { font-weight: 700; color: var(--chip-color, var(--ink)); }
  .chip.unranked { opacity: 0.4; }

  .empty {
    text-align: center;
    color: var(--ink-dim);
    padding: 3rem 1rem;
    font-size: 0.9rem;
    border: 1px dashed var(--line);
    border-radius: 8px;
  }

  footer { text-align: center; color: var(--ink-dim); font-size: 0.78rem; padding: 2rem 1rem 3rem; }

  @media (max-width: 480px) {
    .card { grid-template-columns: 2rem 1fr auto; }
    .modes { padding-left: 0; }
  }
</style>
</head>
<body>

<header>
  <h1>PVPTRIALS <span>Rankings</span></h1>
  <p>Live tier rankings for the club — every gamemode, one profile.</p>
</header>

<main>
  <div class="toolbar">
    <div class="status"><span class="dot"></span><span id="statusText">connecting…</span></div>
    <input class="search" id="search" type="text" placeholder="Find a player…">
  </div>
  <div id="board"></div>
</main>

<footer>PVPTRIALS · community-run tier tracker</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ---- fill in from your Supabase project settings (Project Settings -> API) ----
const SUPABASE_URL = "https://sracbluedbibugcwqvok.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNyYWNibHVlZGJpYnVnY3dxdm9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NDY1MDAsImV4cCI6MjEwNjAyMjUwMH0.ZheKmlxnOPqMbEjA0eIGuKwdquhnRk5zagYmBn1sysA";
// --------------------------------------------------------------------------------

const MODE_ORDER = ["Sword", "Axe", "Mace", "UHC", "NethPot", "Pot", "SMP", "Vanilla"];
const TIER_COLOR = { "1": "var(--t1)", "2": "var(--t2)", "3": "var(--t3)", "4": "var(--t4)", "5": "var(--t5)" };
const SUB_ORDER = { H: 0, M: 1, L: 2 };

let players = [];
let playerModes = [];
let client = null;
let searchTerm = "";
const configured = !SUPABASE_URL.includes("YOUR-PROJECT-REF");

function tierColor(tier) {
  if (!tier) return "var(--ink-dim)";
  return TIER_COLOR[tier.slice(-1)] || "var(--ink-dim)";
}

function tierSortKey(tier) {
  if (!tier) return [9, 9];
  const level = parseInt(tier.slice(-1), 10);
  const sub = SUB_ORDER[tier[0]] ?? 3;
  return [level, sub];
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderBoard() {
  const board = document.getElementById("board");
  let rows = players.filter(p => p.general_tier);

  if (searchTerm) {
    rows = rows.filter(p => p.nick.toLowerCase().includes(searchTerm));
  }

  if (rows.length === 0) {
    board.innerHTML = `<div class="empty">${
      searchTerm ? `No player matching "${escapeHtml(searchTerm)}".`
      : `No one is ranked yet.<br><br>Once a club member's app pushes a result, they'll show up here automatically.`
    }</div>`;
    return;
  }

  rows.sort((a, b) => {
    const [la, sa] = tierSortKey(a.general_tier), [lb, sb] = tierSortKey(b.general_tier);
    if (la !== lb) return la - lb;
    if (sa !== sb) return sa - sb;
    return b.total_points - a.total_points;
  });

  board.innerHTML = "";
  rows.forEach((p, i) => {
    const modesForPlayer = playerModes.filter(pm => pm.nick === p.nick);
    const chips = MODE_ORDER.map(mode => {
      const pm = modesForPlayer.find(x => x.mode === mode);
      const tier = pm && pm.tier;
      const cls = tier ? "" : " unranked";
      return `<div class="chip${cls}" style="--chip-color:${tierColor(tier)}">
        <span class="mode-name">${mode}</span>
        <span class="mode-tier">${tier || "—"}</span>
      </div>`;
    }).join("");

    const card = document.createElement("div");
    card.className = "card";
    card.dataset.nick = p.nick;
    card.innerHTML = `
      <div class="rank">#${i + 1}</div>
      <div class="nick">${escapeHtml(p.nick)}</div>
      <div class="general" style="--tier-color:${tierColor(p.general_tier)}">${p.general_tier}<small>${p.total_points} pts</small></div>
      <div class="modes">${chips}</div>`;
    board.appendChild(card);
  });
}

function flashRow(nick) {
  const el = document.querySelector(`[data-nick="${CSS.escape(nick)}"]`);
  if (el) {
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 900);
  }
}

async function loadData() {
  const [{ data: p }, { data: pm }] = await Promise.all([
    client.from("players").select("*"),
    client.from("player_modes").select("*"),
  ]);
  players = p || [];
  playerModes = pm || [];
  renderBoard();
}

document.getElementById("search").addEventListener("input", (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  renderBoard();
});

async function init() {
  if (!configured) {
    document.getElementById("statusText").textContent =
      "not connected — add your Supabase URL and key in index.html";
    document.querySelector(".dot").style.background = "#8a857d";
    renderBoard();
    return;
  }
  client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  await loadData();
  document.getElementById("statusText").textContent = "live";

  client.channel("public:players")
    .on("postgres_changes", { event: "*", schema: "public", table: "players" }, async (payload) => {
      await loadData();
      const nick = payload.new?.nick || payload.old?.nick;
      if (nick) flashRow(nick);
    })
    .subscribe();

  client.channel("public:player_modes")
    .on("postgres_changes", { event: "*", schema: "public", table: "player_modes" }, async (payload) => {
      await loadData();
      const nick = payload.new?.nick || payload.old?.nick;
      if (nick) flashRow(nick);
    })
    .subscribe();
}

init();
</script>
</body>
</html>
