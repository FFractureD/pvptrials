<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PVPTRIALS Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#050a17; --panel:#0a1226; --row:#0d1830; --row-hover:#112245; --line:#16284d; --line2:#25427a; --blue:#4fb4ff;
    --ink:#eaf1ff; --dim:#8da2c7; --faint:#4a6089; --gold:#ffcf5a;
    --font-display:'Space Grotesk','Segoe UI',sans-serif; --font-body:'Inter',-apple-system,'Segoe UI',sans-serif;
  }
  :root { color-scheme: dark; }
  * { box-sizing:border-box; }
  html { scroll-padding-top: env(safe-area-inset-top,0px); }
  body { margin:0; background:var(--bg) radial-gradient(ellipse 1000px 520px at 50% -8%, rgba(60,140,255,.28), transparent 65%) no-repeat; background-image:linear-gradient(rgba(79,180,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(79,180,255,.04) 1px,transparent 1px),radial-gradient(ellipse 1000px 520px at 50% -8%, rgba(60,140,255,.28), transparent 65%); background-size:42px 42px,42px 42px,100% 100%; background-attachment:fixed; color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  .wrap { max-width:1200px; margin:0 auto; padding:1.2rem 1rem 3rem; }

  /* top bar */
  .topbar { box-shadow:0 0 40px -18px var(--blue); display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:0.7rem 1.2rem;
    border:1px solid var(--line); border-radius:16px; background:var(--panel); margin-bottom:2.2rem; }
  .nav-logo { height:52px; width:auto; max-width:60vw; }
  .search-wrap { position:relative; }
  .search { background:#0f1a35; border:1px solid var(--line); color:var(--ink); padding:0.55rem 0.9rem 0.55rem 2.3rem;
    border-radius:12px; font:inherit; font-size:0.88rem; width:260px; max-width:100%; }
  .search:focus { outline:none; border-color:var(--blue); }
  .search::placeholder { color:var(--faint); }
  .search-wrap svg { position:absolute; left:0.8rem; top:50%; transform:translateY(-50%); width:15px; height:15px; stroke:var(--dim); fill:none; stroke-width:2; }

  /* gamemode tabs */
  .tabs { display:flex; gap:0.4rem; overflow-x:auto; scrollbar-width:none; padding-left:0.2rem; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; width:104px; display:flex; flex-direction:column; align-items:center; gap:0.35rem; padding:0.7rem 0 0.55rem;
    background:var(--panel); border:1px solid var(--line); border-bottom:none; border-radius:16px 16px 0 0; color:var(--dim);
    font:600 0.82rem var(--font-body); cursor:pointer; position:relative; transition:color .15s, background .15s; }
  .tab img { width:26px; height:26px; object-fit:contain; opacity:.55; transition:opacity .15s; }
  .tab:hover { color:var(--ink); } .tab:hover img { opacity:.9; }
  .tab.active { color:#fff; background:#0e1c3a; }
  .tab.active img { opacity:1; }
  .tab.active::after { content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--blue); box-shadow:0 0 10px var(--blue); }

  .board-panel { box-shadow:0 0 50px -25px var(--blue); background:var(--panel); border:1px solid var(--line); border-radius:0 18px 18px 18px; padding:1rem 1.2rem 1.4rem; margin-top:-1px; }
  .panel-top { display:flex; justify-content:flex-end; align-items:center; gap:0.8rem; margin-bottom:1.1rem; flex-wrap:wrap; }
  .info-wrap { position:relative; }
  .nav-btn { display:flex; align-items:center; gap:0.45rem; background:#122044; border:1px solid var(--line); color:var(--ink);
    padding:0.5rem 0.9rem; border-radius:10px; font:600 0.82rem var(--font-body); cursor:pointer; }
  .nav-btn:hover { border-color:var(--line2); }
  .nav-btn svg { width:15px; height:15px; stroke:var(--ink); fill:none; stroke-width:2; }
  .server-pill { position:relative; display:flex; align-items:center; gap:0.7rem; cursor:pointer; padding:0.3rem 0.5rem; border-radius:10px; }
  .server-pill:hover { background:#0f1a35; }
  .server-pill .lbl { font-size:0.6rem; font-weight:700; letter-spacing:.06em; color:var(--dim); text-transform:uppercase; }
  .server-pill .ip { font:700 0.82rem var(--font-display); background:#122044; padding:0.2rem 0.6rem; border-radius:6px; margin-top:2px; }
  .server-pill.copied .ip { color:#3ee87a; }
  .copy-flash { position:absolute; top:calc(100% + 6px); right:0; background:#3ee87a; color:#06180d; font-size:.68rem; font-weight:700;
    padding:.25rem .55rem; border-radius:6px; opacity:0; transition:opacity .15s; pointer-events:none; }
  .server-pill.copied .copy-flash { opacity:1; }

  .info-popover { position:absolute; top:calc(100% + 8px); right:0; width:320px; max-height:70vh; overflow-y:auto; background:var(--panel);
    border:1px solid var(--line2); border-radius:14px; box-shadow:0 20px 50px -10px rgba(0,0,0,.7); padding:.9rem; opacity:0;
    transform:translateY(-6px); pointer-events:none; transition:opacity .15s, transform .15s; z-index:30; }
  .info-popover.open { opacity:1; transform:none; pointer-events:auto; }
  .info-tabs { display:flex; gap:.3rem; margin-bottom:.8rem; }
  .info-tab { flex:1; text-align:center; background:#0f1a35; border:1px solid var(--line); color:var(--dim); padding:.4rem; border-radius:8px; font-size:.78rem; font-weight:600; cursor:pointer; }
  .info-tab.active { color:var(--ink); border-color:var(--line2); background:#162a55; }
  .info-section-title { font-size:.82rem; font-weight:700; margin:0 0 .6rem; }
  .info-row { display:flex; align-items:center; justify-content:space-between; gap:.6rem; padding:.45rem 0; border-bottom:1px solid var(--line); font-size:.78rem; }
  .info-row:last-child { border-bottom:none; }
  .info-row .name { font-weight:700; } .info-row .desc { color:var(--dim); font-size:.72rem; text-align:right; }
  .pts-grid { display:grid; grid-template-columns:44px repeat(3,1fr); gap:.35rem; align-items:center; margin-bottom:.45rem; }
  .pts-grid .lvl { font:700 .78rem var(--font-display); }
  .pts-cell { text-align:center; background:#0f1a35; border:1px solid var(--line); border-radius:7px; padding:.3rem 0; font-size:.74rem; font-weight:700; }
  .pts-cell small { display:block; font-size:.55rem; color:var(--faint); font-weight:700; letter-spacing:.05em; }
  .pts-head { color:var(--faint); font-size:.6rem; font-weight:700; letter-spacing:.08em; text-align:center; }

  /* list */
  .card { position:relative; display:grid; grid-template-columns:3rem 2.6rem minmax(0,1fr) auto; align-items:center; column-gap:.9rem; padding:.65rem 1rem .65rem 0;
    background:var(--row); border:1px solid var(--line); border-radius:10px; margin-bottom:.4rem; overflow:hidden; cursor:pointer;
    transition:background .5s ease, border-color .25s ease, transform .15s ease; }
  .card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--tier-color,var(--faint)); box-shadow:0 0 12px 0 var(--tier-color,transparent); }
  .card:hover { background:var(--row-hover); border-color:var(--blue); transform:translateX(2px); }
  .card.flash { background:rgba(79,209,255,.12); border-color:var(--blue); }
  .rank-block { display:flex; align-items:center; justify-content:center; align-self:stretch; font:italic 700 1.05rem var(--font-display); color:var(--dim); background:var(--panel); }
  .rank-block.r1 { color:#050a17; background:linear-gradient(160deg,#ffe08a,#d9a339); }
  .rank-block.r2 { color:#050a17; background:linear-gradient(160deg,#e6ecf2,#aab6c4); }
  .rank-block.r3 { color:#050a17; background:linear-gradient(160deg,#e8b48a,#b5713c); }
  .avatar { width:40px; height:40px; border-radius:7px; image-rendering:pixelated; background:var(--panel); border:1px solid var(--line); }
  .identity { min-width:0; }
  .nick { display:flex; align-items:center; gap:.5rem; font:600 1rem var(--font-display); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .region { font:800 .6rem var(--font-display); padding:.12rem .38rem; border-radius:5px; background:#1b2b52; color:#a9bde3; letter-spacing:.04em; }
  .region.NA { background:rgba(255,90,90,.18); color:#ff6b6b; } .region.EU { background:rgba(62,232,122,.15); color:#3ee87a; }
  .region.ME { background:rgba(255,207,90,.18); color:#ffcf5a; }
  .modal-head .region { font-size:.8rem; padding:.3rem .6rem; margin-top:.7rem; }
  .title-line { display:flex; align-items:center; gap:.35rem; font-size:.72rem; font-weight:600; color:var(--title-color,var(--faint)); margin-top:.1rem; }
  .title-line .pi { color:var(--faint); font-weight:500; } .title-line svg { width:14px; height:14px; flex:none; }
  .modes-row { display:flex; align-items:center; gap:.55rem; flex-wrap:nowrap; overflow-x:auto; overflow-y:visible; scrollbar-width:none; padding:0 0 8px .4rem; }
  .modes-row::-webkit-scrollbar { display:none; }
  .badge { position:relative; display:flex; align-items:center; justify-content:center; width:32px; height:32px; flex:none; border-radius:50%; background:var(--panel);
    border:2px solid var(--c,var(--line)); box-shadow:0 0 0 1px rgba(0,0,0,.3), 0 0 10px -3px var(--c,transparent); }
  .badge.un { border-style:dashed; border-color:var(--line2); opacity:.4; box-shadow:none; }
  .badge.un img { filter:grayscale(1); opacity:.7; }
  .badge img { width:19px; height:19px; object-fit:contain; pointer-events:none; }
  .badge .tag { position:absolute; bottom:-7px; left:50%; transform:translateX(-50%); background:var(--c,var(--faint)); color:#050a17; font:800 .52rem var(--font-display); line-height:1; padding:.16rem .3rem; border-radius:4px; white-space:nowrap; }
  .badge .tt { position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); background:#040913; border:1px solid var(--line2); font-size:.68rem; font-weight:600;
    white-space:nowrap; padding:.25rem .5rem; border-radius:6px; opacity:0; pointer-events:none; transition:opacity .12s; z-index:3; }
  .badge:hover .tt { opacity:1; }
  /* gamemode tabs: tier columns */
  .tier-cols { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:.6rem; align-items:start; }
  .tier-col { background:var(--row); border:1px solid var(--line); border-radius:12px; overflow:hidden; min-width:0; }
  .tier-col-head { display:flex; align-items:center; justify-content:center; gap:.45rem; padding:.75rem .5rem; font:700 1.05rem var(--font-display); }
  .tier-col-head svg { width:20px; height:20px; flex:none; }
  .tier-row { display:flex; align-items:center; gap:.55rem; padding:.38rem .6rem; border-top:1px solid var(--line); cursor:pointer; transition:background .15s; }
  .tier-row:hover { background:var(--row-hover); }
  .tier-row.flash { background:rgba(79,209,255,.14); }
  .tier-row img { width:24px; height:24px; border-radius:4px; image-rendering:pixelated; background:var(--panel); flex:none; }
  .tier-row .tn { flex:1; min-width:0; font:600 .84rem var(--font-body); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tier-row .chev { display:flex; flex:none; }
  .tier-row .chev svg { width:15px; height:15px; fill:none; stroke:var(--c); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .tier-row.lt .chev { opacity:.45; }
  .tier-col-empty { padding:.9rem; text-align:center; color:var(--faint); font-size:.78rem; border-top:1px solid var(--line); }
  @media (max-width:900px) { .tier-cols { grid-template-columns:repeat(5,180px); overflow-x:auto; padding-bottom:.4rem; } }

  .discord-btn { display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:9px; background:#5865f2; color:#fff; transition:filter .15s, transform .15s; }
  .discord-btn:hover { filter:brightness(1.12); transform:translateY(-1px); }
  .discord-btn svg { width:19px; height:19px; fill:currentColor; }

  .empty { text-align:center; color:var(--dim); padding:3.5rem 1.5rem; line-height:1.6; border:1px dashed var(--line2); border-radius:12px; }
  .empty strong { color:var(--ink); }
  .status { display:flex; align-items:center; gap:.5rem; color:var(--dim); font-size:.78rem; margin-right:auto; }
  .dot { width:7px; height:7px; border-radius:50%; background:#3ee87a; box-shadow:0 0 6px #3ee87a99; }
  footer { text-align:center; color:var(--faint); font-size:.78rem; padding:2rem 1rem; }

  /* profile modal */
  .modal-backdrop { position:fixed; inset:0; background:rgba(4,6,10,.75); backdrop-filter:blur(4px); z-index:50; display:flex; align-items:flex-start; justify-content:center;
    padding:5vh 1rem 2rem; overflow-y:auto; opacity:0; pointer-events:none; transition:opacity .18s; }
  .modal-backdrop.open { opacity:1; pointer-events:auto; }
  .modal { width:100%; max-width:600px; background:var(--panel); border:1px solid var(--line2); border-radius:20px; overflow:hidden; transform:translateY(10px); transition:transform .18s; box-shadow:0 30px 80px -20px #000; }
  .modal-backdrop.open .modal { transform:none; }
  .modal-head { position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; padding:1.8rem 1.4rem 1.3rem; background:radial-gradient(ellipse at 50% 0, var(--tier-color,#ffcf5a)22, transparent 70%); border-bottom:1px solid var(--line); }
  .modal-close { position:absolute; top:1rem; right:1rem; width:32px; height:32px; display:flex; align-items:center; justify-content:center; background:#0f1a35; border:1px solid var(--line); border-radius:9px; color:var(--dim); cursor:pointer; }
  .modal-close:hover { color:var(--ink); }
  .modal-skin { height:150px; image-rendering:pixelated; filter:drop-shadow(0 8px 14px rgba(0,0,0,.5)); }
  .modal-head h2 { font:700 1.7rem var(--font-display); margin:.6rem 0 .3rem; }
  .modal-head .title-line { justify-content:center; font-size:.92rem; }
  .modal-head .region { margin-top:.7rem; }
  .stat-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:.6rem; padding:1.1rem 1.4rem; border-bottom:1px solid var(--line); }
  .stat { background:var(--row); border:1px solid var(--line); border-radius:12px; padding:.7rem .5rem; text-align:center; }
  .stat .num { font:700 1.25rem var(--font-display); } .stat .num.good { color:#3ee87a; } .stat .num.bad { color:#ff6b6b; }
  .stat .lbl { font-size:.64rem; color:var(--dim); text-transform:uppercase; letter-spacing:.07em; margin-top:.15rem; }
  .sect { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--faint); padding:1rem 1.4rem .5rem; }
  .modal-modes { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:.5rem; padding:0 1.4rem 1rem; border-bottom:1px solid var(--line); }
  .mchip { display:flex; align-items:center; gap:.6rem; background:var(--row); border:1px solid var(--line); border-left:3px solid var(--c,var(--line2)); border-radius:10px; padding:.5rem .6rem; }
  .mchip img { width:22px; height:22px; object-fit:contain; } .mchip.un img { filter:grayscale(1); opacity:.5; }
  .mchip .mn { font-size:.74rem; font-weight:600; } .mchip .mp { font-size:.62rem; color:var(--dim); }
  .mchip .tier-pill { margin-left:auto; }
  .match-log { max-height:300px; overflow-y:auto; padding:0 1.4rem 1.3rem; }
  .match-row { display:grid; grid-template-columns:auto 1fr auto auto; align-items:center; gap:.7rem; padding:.55rem .2rem; border-bottom:1px solid var(--line); font-size:.83rem; }
  .match-row:last-child { border-bottom:none; }
  .match-result { width:8px; height:8px; border-radius:50%; } .match-result.win { background:#3ee87a; } .match-result.loss { background:#ff6b6b; }
  .match-mode { font-weight:600; } .match-note { color:var(--dim); font-size:.76rem; text-align:right; } .match-time { color:var(--faint); font-size:.72rem; white-space:nowrap; }
  .match-log-empty, .match-log-loading { color:var(--dim); font-size:.85rem; text-align:center; padding:1.5rem; }

  @media (max-width:560px) {
    .card { grid-template-columns:2rem 2.4rem minmax(0,1fr); row-gap:.5rem; padding-right:.8rem; }
    .modes-row { grid-column:1 / -1; padding-left:.9rem; }
    .tab { width:84px; } .search { width:100%; } .topbar { flex-wrap:wrap; }
  }
</style>
</head>

const GOLD_RGB = TITLES[0].color;
function mixed(t) {
  let [r, g, b] = t.color;
  if (t.mix) { r = Math.round(r + (GOLD_RGB[0] - r) * t.mix); g = Math.round(g + (GOLD_RGB[1] - g) * t.mix); b = Math.round(b + (GOLD_RGB[2] - b) * t.mix); }
  return `rgb(${r},${g},${b})`;
}

}

function tierColor(t) { return t ? (LEVEL_COLOR[t.slice(-1)] || "#7d8799") : "var(--faint)"; }
function tierSortKey(t) { return t ? [parseInt(t.slice(-1), 10), SUB_ORDER[t[0]] ?? 3] : [9, 9]; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// ranked rows for the current tab. Every position is unique: when points are equal,
// whoever reached that total first (points_reached_at) is placed higher.
const reachedMs = r => { const t = r.reached ? new Date(r.reached).getTime() : NaN; return isNaN(t) ? Infinity : t; };
const byReached = (a, b) => { const x = reachedMs(a), y = reachedMs(b); return x === y ? 0 : x < y ? -1 : 1; };
function buildRows(filter) {
  let rows;
  if (filter === "Overall") {
    rows = players.filter(p => p.general_tier).map(p => ({ ...p, points: p.total_points, sortTier: p.general_tier, reached: p.points_reached_at }));
    rows.sort((a, b) => b.points - a.points || byReached(a, b) || a.nick.localeCompare(b.nick));
  } else {
    rows = playerModes.filter(pm => pm.mode === filter && pm.tier).map(pm => {
      const p = players.find(x => x.nick === pm.nick) || { nick: pm.nick };
      return { ...p, points: pm.points ?? POINTS[pm.tier] ?? 0, sortTier: pm.tier, reached: pm.points_reached_at };
    });
    rows.sort((a, b) => {
      const [la, sa] = tierSortKey(a.sortTier), [lb, sb] = tierSortKey(b.sortTier);
      return la - lb || sa - sb || b.points - a.points || byReached(a, b) || a.nick.localeCompare(b.nick);
    });
  }
  rows.forEach((r, i) => { r.rank = i + 1; });
  return rows;
}

  3: { c: "#e39a5f", bg: "linear-gradient(180deg,rgba(227,154,95,.26),rgba(227,154,95,.10))", trophy: true },
  4: { c: "#eaf1ff", bg: "#0d1830", trophy: false },
  5: { c: "#8da2c7", bg: "#0d1830", trophy: false },
};
function renderTierColumns(board, rows) {
  const by = { 1: [], 2: [], 3: [], 4: [], 5: [] };
  rows.forEach(r => { const l = r.sortTier ? r.sortTier.slice(-1) : null; if (by[l]) by[l].push(r); });
  board.innerHTML = `<div class="tier-cols">${[1, 2, 3, 4, 5].map(n => {
    const st = COL_STYLE[n];
    return `<div class="tier-col">
      <div class="tier-col-head" style="background:${st.bg};color:${st.c}">${st.trophy ? TROPHY(st.c) : ""}Tier ${n}</div>
      ${by[n].map(p => `<div class="tier-row${p.sortTier[0] === "L" ? " lt" : ""}" data-nick="${escapeHtml(p.nick)}" style="--c:${tierColor(p.sortTier)}">
        <img src="https://mc-heads.net/avatar/${encodeURIComponent(String(p.nick).toLowerCase())}/48" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <span class="tn">${escapeHtml(p.nick)}</span>
        <span class="chev" title="${p.sortTier}">${p.sortTier[0] === "H" ? CHEV_TWO : CHEV_ONE}</span></div>`).join("") || `<div class="tier-col-empty">—</div>`}
    </div>`;
  }).join("")}</div>`;
  board.querySelectorAll(".tier-row").forEach(el => el.addEventListener("click", () => openProfile(el.dataset.nick)));
}

function renderBoard() {
  const board = document.getElementById("board");
  let rows = buildRows(activeFilter);
  if (searchTerm) rows = rows.filter(p => p.nick.toLowerCase().includes(searchTerm));
  if (!rows.length) {
    board.innerHTML = `<div class="empty">${searchTerm ? `No player matching <strong>"${escapeHtml(searchTerm)}"</strong>.`
      : `No one is ranked in <strong>${escapeHtml(activeFilter)}</strong> yet.<br>Once a club member's app pushes a result, they'll show up here automatically.`}</div>`;
    return;
  }
  if (activeFilter !== "Overall") { renderTierColumns(board, rows); return; }
  board.innerHTML = "";
  rows.forEach(p => {
    const mp = playerModes.filter(pm => pm.nick === p.nick);
    const badges = MODE_ORDER.map(m => badge(m, (mp.find(x => x.mode === m) || {}).tier)).join("");
    const rc = p.rank <= 3 ? ` r${p.rank}` : "";
    const title = titleFor(p.total_points || 0);
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.nick = p.nick;
    card.style.setProperty("--tier-color", tierColor(p.sortTier));
    const sub = activeFilter === "Overall" ? "" : `<span style="color:${tierColor(p.sortTier)};font-weight:700">${p.sortTier}</span> <span class="pi">·</span> `;
    card.innerHTML = `
      <div class="rank-block${rc}">${p.rank}</div>
      <img class="avatar" src="https://mc-heads.net/avatar/${encodeURIComponent(String(p.nick).toLowerCase())}/64" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="identity"><div class="nick">${escapeHtml(p.nick)}${regionBadge(p.region)}</div>
        <div class="title-line" style="--title-color:${title.color}">${title.name} <span class="pi">· ${sub}${fmt(p.points)} pts</span></div></div>
      <div class="modes-row">${badges}</div>`;
    card.addEventListener("click", () => openProfile(p.nick));
    board.appendChild(card);
  });
}


// ---------------- preview/demo data (used when Supabase is unreachable or empty) ----------------
let demoMode = false;
function makeDemo() {
  const names = ["Marlowww","ItzRealMe","coldified","Swight","janekv","BlvckWlf","Kylaz","ninorc15","Lurrn","Arsakha","yMiau","Zephyrr","NovaStrike","Frostbite","KrakenMC","Vexx","Ashen","TheRealDuck"];
  const regions = ["NA","EU","EU","NA","EU","ME","NA","EU"];
  const tiers = ["HT1","MT1","LT1","HT2","MT2","LT2","HT3","MT3","LT3","HT4","MT4","LT4","HT5","MT5","LT5"];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const P = [], M = [];
  names.forEach((nick, i) => {
    const strength = 1 - i / names.length;           // earlier names are stronger
    let total = 0, best = null;
    MODE_ORDER.forEach(mode => {
      if (rnd() < 0.12 + i * 0.01) return;           // some unranked
      const idx = Math.min(14, Math.max(0, Math.floor((1 - strength) * 10 + rnd() * 6)));
      const tier = tiers[idx];
      M.push({ nick, mode, tier, points: POINTS[tier] });
      total += POINTS[tier];
      if (!best || tiers.indexOf(tier) < tiers.indexOf(best)) best = tier;
    });
    P.push({ nick, region: regions[i % regions.length], total_points: total, general_tier: best || "LT5" });
  });
  return { P, M };
}
function demoMatches(nick) {
  const kinds = ["Ranked duel", "Sub match win", "Tier test win → HT3", "Tier test loss", "Ranked duel"];
  return Array.from({ length: 8 }, (_, i) => ({ won: (i * 7 + nick.length) % 3 !== 0, mode: MODE_ORDER[(i + nick.length) % 8],
    note: kinds[i % kinds.length], played_at: new Date(Date.now() - (i + 1) * 3.2 * 3600e3).toISOString() }));
}

function flashRow(nick) {
  const el = document.querySelector(`[data-nick="${CSS.escape(nick)}"]`);
  if (el) { el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1000); }
}
async function loadData() {
  let p = null, pm = null;
  try {
    const [a, b] = await Promise.all([client.from("players").select("*"), client.from("player_modes").select("*")]);
    p = a.data; pm = b.data;
  } catch (e) {}
  if (!p || !p.length) {
    const d = makeDemo(); players = d.P; playerModes = d.M; demoMode = true;
    document.getElementById("statusText").textContent = "preview data";
  } else { players = p; playerModes = pm || []; demoMode = false; document.getElementById("statusText").textContent = "live"; }
  renderBoard();
}
document.getElementById("search").addEventListener("input", e => { searchTerm = e.target.value.trim().toLowerCase(); renderBoard(); });

// ---------------- profile modal ----------------
const modalBackdrop = document.getElementById("modalBackdrop");
const matchLogEl = document.getElementById("matchLog");
function timeAgo(iso) {
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "just now"; if (mins < 60) return `${mins}m ago`;
  const h = Math.floor(mins / 60); if (h < 24) return `${h}h ago`;
  const d = Math.floor(h / 24); return d < 30 ? `${d}d ago` : new Date(iso).toLocaleDateString();
}
function matchKindLabel(r) {
  if (r.match_kind === "test") return r.won ? `Tier test win${r.target ? " → " + r.target : ""}` : "Tier test loss";
  if (r.match_kind === "sub") return r.won ? "Sub match win" : "Sub match loss";
  if (r.match_kind === "duel_ranked") return "Ranked duel";
  return r.note || (r.won ? "Win" : "Loss");
}
function statBox(num, lbl, cls = "") { return `<div class="stat"><div class="num ${cls}">${num}</div><div class="lbl">${lbl}</div></div>`; }

async function openProfile(nick) {
  const p = players.find(x => x.nick === nick);
  if (!p) return;
  const overall = buildRows("Overall").find(r => r.nick === nick);
  const t = titleFor(p.total_points || 0);
  document.getElementById("modalHead").style.setProperty("--tier-color", tierColor(p.general_tier));
  document.getElementById("modalSkin").src = skinBody(nick);
  document.getElementById("modalNick").textContent = nick;
  const te = document.getElementById("modalTitle");
  te.style.setProperty("--title-color", t.color);
  te.innerHTML = `${diamond(t.color)}<span class="tn">${t.name}</span>`;
  document.getElementById("modalRegion").innerHTML = regionBadge(p.region);
  const mp = playerModes.filter(pm => pm.nick === nick);
  document.getElementById("modalModes").innerHTML = MODE_ORDER.map(m => {
    const tier = (mp.find(x => x.mode === m) || {}).tier;
    return `<div class="mchip${tier ? "" : " un"}" style="--c:${tierColor(tier)}"><img src="${MODE_ICONS_DATA[m] || ""}" alt="">
      <div><div class="mn">${m}</div><div class="mp">${tier && POINTS[tier] != null ? fmt(POINTS[tier]) + " pts" : "Unranked"}</div></div>${tierPill(tier)}</div>`;
  }).join("");
  const base = statBox(overall ? "#" + overall.rank : "—", "Position") + statBox(fmt(p.total_points || 0), "Points");
  const setStats = (wr, w, l) => document.getElementById("modalStats").innerHTML = base + statBox(wr, "Win rate") + statBox(w, "Wins", "good") + statBox(l, "Losses", "bad");
  setStats("—", "—", "—");
  matchLogEl.innerHTML = `<div class="match-log-loading">Loading match history…</div>`;
  modalBackdrop.classList.add("open");
  document.body.style.overflow = "hidden";
  let data, error;
  if (demoMode) { data = demoMatches(nick); }
  else if (!configured || !client) return;
  else ({ data, error } = await client.from("match_history").select("*").eq("nick", nick).order("played_at", { ascending: false }).limit(100));
  if (error || !data) { matchLogEl.innerHTML = `<div class="match-log-empty">Couldn't load match history.</div>`; return; }
  if (!data.length) { matchLogEl.innerHTML = `<div class="match-log-empty">No recorded matches yet.</div>`; return; }
  const wins = data.filter(r => r.won).length;
  setStats(Math.round(wins / data.length * 100) + "%", wins, data.length - wins);
  matchLogEl.innerHTML = data.map(r => `<div class="match-row"><div class="match-result ${r.won ? "win" : "loss"}"></div>
    <div class="match-mode">${escapeHtml(r.mode || "")}</div><div class="match-note">${escapeHtml(matchKindLabel(r))}</div><div class="match-time">${timeAgo(r.played_at)}</div></div>`).join("");
}
function closeProfile() { modalBackdrop.classList.remove("open"); document.body.style.overflow = ""; }
document.getElementById("modalClose").addEventListener("click", closeProfile);
modalBackdrop.addEventListener("click", e => { if (e.target === modalBackdrop) closeProfile(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeProfile(); });

// ---------------- tabs ----------------
function renderNavTabs() {
  const wrap = document.getElementById("navTabs");
  const trophy = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${activeFilter === "Overall" ? "#ffcf5a" : "#8a96ab"}" stroke-width="2" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 20h8"/></svg>`;
  wrap.innerHTML = ["Overall", ...MODE_ORDER].map(t =>
    `<button class="tab${t === activeFilter ? " active" : ""}" data-filter="${t}">${t === "Overall" ? trophy : `<img src="${MODE_ICONS_DATA[t] || ""}" alt="">`}${t}</button>`).join("");
  wrap.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { activeFilter = b.dataset.filter; renderNavTabs(); renderBoard(); }));
}

// ---------------- info popover ----------------
function renderInfoPopover() {
  document.getElementById("infoTitlesList").innerHTML = TITLES.slice(0, 6).map(t =>
    `<div class="info-row"><span class="name" style="color:${mixed(t)}">${t.name}</span><span class="desc">Obtained ${t.need}+ total points</span></div>`).join("")
    + `<div class="info-row"><span class="name" style="color:var(--dim)">Rookie</span><span class="desc">Starting rank, under 10 points</span></div>`;
  const head = `<div class="pts-grid"><span></span><span class="pts-head">HIGH</span><span class="pts-head">MID</span><span class="pts-head">LOW</span></div>`;
  document.getElementById("infoPointsList").innerHTML = head + [1, 2, 3, 4, 5].map(l => `
    <div class="pts-grid"><span class="lvl" style="color:${LEVEL_COLOR[l]}">Tier ${l}</span>
      ${["H", "M", "L"].map(s => `<div class="pts-cell">${fmt(POINTS[s + "T" + l])}<small>${s}T${l}</small></div>`).join("")}</div>`).join("");
}
const infoBtn = document.getElementById("infoBtn"), infoPopover = document.getElementById("infoPopover");
infoBtn.addEventListener("click", e => { e.stopPropagation(); infoPopover.classList.toggle("open"); });
document.addEventListener("click", e => { if (!infoPopover.contains(e.target)) infoPopover.classList.remove("open"); });
document.querySelectorAll(".info-tab").forEach(tab => tab.addEventListener("click", () => {
  document.querySelectorAll(".info-tab").forEach(t => t.classList.remove("active")); tab.classList.add("active");
  document.getElementById("infoTitles").style.display = tab.dataset.info === "titles" ? "" : "none";
  document.getElementById("infoPoints").style.display = tab.dataset.info === "points" ? "" : "none";
}));

// ---------------- server IP copy ----------------
const serverPill = document.getElementById("serverPill");
document.getElementById("serverIp").textContent = SERVER_IP;
serverPill.addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(SERVER_IP); } catch (e) {}
  serverPill.classList.add("copied"); setTimeout(() => serverPill.classList.remove("copied"), 1200);
});

async function init() {
  const logoEl = document.getElementById("navLogo");
  logoEl.src = LOGO_DATA;
  const li = new Image();
  li.onload = () => {
    try {
      const c = document.createElement("canvas"); c.width = li.width; c.height = li.height;
      const x = c.getContext("2d"); x.drawImage(li, 0, 0);
      const d = x.getImageData(0, 0, c.width, c.height).data;
      let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
      for (let y = 0; y < c.height; y++) for (let k = 0; k < c.width; k++) if (d[(y * c.width + k) * 4 + 3] > 12) { if (k < x0) x0 = k; if (k > x1) x1 = k; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 <= x0 || y1 <= y0) return;
      const o = document.createElement("canvas"); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
      o.getContext("2d").drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
      logoEl.src = o.toDataURL("image/png");
    } catch (e) {}
  };
  li.src = LOGO_DATA;
  renderNavTabs(); renderInfoPopover();
  if (!configured) {
    document.getElementById("statusText").textContent = "not connected — add your Supabase URL and key in index.html";
    document.getElementById("dot").style.background = "#6b7d99";
    const d = makeDemo(); players = d.P; playerModes = d.M; demoMode = true; renderBoard(); return;
  }
  client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  await loadData();
  for (const table of ["players", "player_modes"]) {
    client.channel("public:" + table).on("postgres_changes", { event: "*", schema: "public", table }, async payload => {
      await loadData();
      const nick = payload.new?.nick || payload.old?.nick;
      if (nick) flashRow(nick);
    }).subscribe();
  }
}
init();
</script>
