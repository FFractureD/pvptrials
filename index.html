<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PVPTRIALS Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0a0e17;
    --panel: #111a2b;
    --card: #0e1524;
    --card-hover: #131d31;
    --line: #1f2c42;
    --line-bright: #2c3f5e;
    --ink: #e8edf5;
    --ink-dim: #6b7d99;
    --ink-faint: #445269;
    --cyan: #4fd1ff;
    --cyan-dim: #4fd1ff33;
    --violet: #8c7cf0;
    --t1: #4fd1ff;
    --t2: #7c8cff;
    --t3: #a07cf0;
    --t4: #6b7d99;
    --t5: #48566e;
    --font-display: 'Space Grotesk', 'Segoe UI', sans-serif;
    --font-body: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  }
  :root:not([data-theme="dark"]) { color-scheme: dark; }

  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--void);
    background-image:
      linear-gradient(rgba(79,209,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,209,255,0.035) 1px, transparent 1px),
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(79,209,255,0.14), transparent 60%);
    background-size: 42px 42px, 42px 42px, 100% 100%;
    color: var(--ink);
    font-family: var(--font-body);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  ::selection { background: var(--cyan-dim); color: var(--ink); }

  /* ---------- header ---------- */
  header {
    position: relative;
    padding: 4.5rem 1.5rem 3rem;
    text-align: center;
    overflow: hidden;
    border-bottom: 1px solid var(--line);
  }
  header::before {
    content: "";
    position: absolute;
    top: 0; left: 50%;
    width: 640px; height: 320px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(79,209,255,0.16), transparent 70%);
    pointer-events: none;
  }
  .eyebrow {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--font-body);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--cyan);
    background: rgba(79,209,255,0.08);
    border: 1px solid rgba(79,209,255,0.25);
    padding: 0.32rem 0.8rem 0.32rem 0.65rem;
    border-radius: 999px;
    margin-bottom: 1.4rem;
  }
  .eyebrow .pip {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px 1px var(--cyan);
    animation: pip 1.8s ease-in-out infinite;
  }
  @keyframes pip { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  header h1 {
    position: relative;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.4rem, 6vw, 3.8rem);
    letter-spacing: -0.02em;
    line-height: 1.02;
    margin: 0 0 0.7rem;
  }
  header h1 .glow {
    background: linear-gradient(120deg, var(--cyan), var(--violet) 85%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    position: relative;
    color: var(--ink-dim);
    font-size: 0.98rem;
    margin: 0;
    max-width: 40ch;
    margin-inline: auto;
  }

  /* ---------- toolbar ---------- */
  main { max-width: 800px; margin: 0 auto; padding: 2.2rem 1.25rem 4rem; }

  .toolbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.4rem;
    padding: 0.7rem 0.9rem;
    background: rgba(10,14,23,0.82);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 12px;
    flex-wrap: wrap;
  }
  .status { display: flex; align-items: center; gap: 0.55rem; color: var(--ink-dim); font-size: 0.8rem; font-weight: 500; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #3ee87a;
    box-shadow: 0 0 6px 1px #3ee87a99;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(62,232,122,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(62,232,122,0); }
    100% { box-shadow: 0 0 0 0 rgba(62,232,122,0); }
  }
  .search-wrap { position: relative; }
  .search {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 0.5rem 0.85rem 0.5rem 2.1rem;
    border-radius: 8px;
    font-size: 0.85rem;
    font-family: var(--font-body);
    min-width: 190px;
    transition: border-color .15s, background .15s;
  }
  .search::placeholder { color: var(--ink-faint); }
  .search:focus { outline: none; border-color: var(--cyan); background: var(--card-hover); }
  .search-wrap svg {
    position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; stroke: var(--ink-faint); pointer-events: none;
  }

  /* ---------- cards ---------- */
  .card {
    position: relative;
    display: grid;
    grid-template-columns: 3rem 2.6rem 1fr auto;
    align-items: center;
    column-gap: 0.9rem;
    padding: 0.65rem 1rem 0.65rem 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 0.4rem;
    overflow: hidden;
    transition: background .5s ease, border-color .25s ease, transform .15s ease;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--tier-color, var(--ink-faint));
    box-shadow: 0 0 12px 0 var(--tier-color, transparent);
  }
  .card:hover {
    border-color: var(--line-bright);
    background: var(--card-hover);
    transform: translateX(2px);
  }
  .card.flash {
    background: rgba(79,209,255,0.1);
    border-color: var(--cyan);
  }
  .card.flash::before { box-shadow: 0 0 20px 2px var(--tier-color, var(--cyan)); }

  .rank-block {
    display: flex;
    align-items: center;
    justify-content: center;
    align-self: stretch;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.05rem;
    font-style: italic;
    color: var(--ink-dim);
    background: var(--panel);
  }
  .rank-block.r1 { color: var(--void); background: linear-gradient(160deg, #ffe08a, #d9a339); }
  .rank-block.r2 { color: var(--void); background: linear-gradient(160deg, #e6ecf2, #aab6c4); }
  .rank-block.r3 { color: var(--void); background: linear-gradient(160deg, #e8b48a, #b5713c); }

  .avatar {
    width: 36px; height: 36px;
    border-radius: 7px;
    image-rendering: pixelated;
    background: var(--panel);
    border: 1px solid var(--line);
    flex: none;
  }

  .identity { min-width: 0; }
  .nick {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: -0.005em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .title-line {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--title-color, var(--ink-faint));
    margin-top: 0.1rem;
  }
  .title-line .pts-inline { color: var(--ink-faint); font-weight: 500; }

  .modes-row {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: visible;
    scrollbar-width: none;
    padding-left: 0.4rem;
    padding-bottom: 8px;
  }
  .modes-row::-webkit-scrollbar { display: none; }

  .mode-badge {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px; height: 32px;
    flex: none;
    border-radius: 50%;
    background: var(--panel);
    border: 2px solid var(--badge-color, var(--line));
    box-shadow: 0 0 0 1px rgba(0,0,0,0.3), 0 0 10px -3px var(--badge-color, transparent);
  }
  .mode-badge.unranked {
    border-style: dashed;
    border-color: var(--line);
    opacity: 0.4;
  }
  .mode-badge.unranked .mode-icon-img { filter: grayscale(1); opacity: 0.7; }
  .mode-icon-img {
    width: 19px; height: 19px;
    object-fit: contain;
    pointer-events: none;
  }
  .mode-tier-tag {
    position: absolute;
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--badge-color, var(--ink-faint));
    color: var(--void);
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 0.52rem;
    line-height: 1;
    padding: 0.16rem 0.3rem;
    border-radius: 4px;
    white-space: nowrap;
    box-shadow: 0 0 6px -1px var(--badge-color, transparent);
  }
  .mode-badge .tt {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: #060a12;
    border: 1px solid var(--line-bright);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 0.68rem;
    font-weight: 600;
    white-space: nowrap;
    padding: 0.25rem 0.5rem;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .12s ease;
    z-index: 2;
  }
  .mode-badge:hover .tt { opacity: 1; }

  .empty {
    text-align: center;
    color: var(--ink-dim);
    padding: 3.5rem 1.5rem;
    font-size: 0.92rem;
    line-height: 1.6;
    border: 1px dashed var(--line);
    border-radius: 12px;
    background: var(--card);
  }
  .empty strong { color: var(--ink); }

  footer {
    text-align: center;
    color: var(--ink-faint);
    font-size: 0.78rem;
    padding: 2rem 1rem 3rem;
    letter-spacing: 0.02em;
  }

  .card { cursor: pointer; }

  /* ---------- profile modal ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(6,9,15,0.72);
    backdrop-filter: blur(3px);
    z-index: 50;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 5vh 1rem 2rem;
    overflow-y: auto;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }

  .modal {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--line-bright);
    border-radius: 16px;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(79,209,255,0.05);
    transform: translateY(10px);
    transition: transform .18s ease;
    overflow: hidden;
  }
  .modal-backdrop.open .modal { transform: translateY(0); }

  .modal-head {
    position: relative;
    padding: 1.6rem 1.6rem 1.3rem;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(160deg, rgba(79,209,255,0.08), transparent 60%);
  }
  .modal-close {
    position: absolute;
    top: 1.1rem; right: 1.1rem;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink-dim);
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .modal-close:hover { color: var(--ink); border-color: var(--line-bright); }

  .modal-head h2 {
    font-family: var(--font-display);
    font-size: 1.6rem;
    font-weight: 700;
    margin: 0 0 0.6rem;
    padding-right: 2.5rem;
  }
  .modal-general {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.95rem;
    padding: 0.35rem 0.75rem;
    border-radius: 7px;
    color: var(--void);
    background: var(--tier-color, var(--cyan));
    box-shadow: 0 0 16px -4px var(--tier-color, var(--cyan));
  }
  .modal-general .pts { font-family: var(--font-body); font-weight: 600; font-size: 0.68rem; opacity: 0.7; }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.6rem;
    padding: 1.2rem 1.6rem;
    border-bottom: 1px solid var(--line);
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.7rem 0.6rem;
    text-align: center;
  }
  .stat .num {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--ink);
  }
  .stat .num.good { color: #3ee87a; }
  .stat .num.bad { color: #ff6b6b; }
  .stat .lbl {
    font-size: 0.68rem;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 0.2rem;
  }

  .modal-modes {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    padding: 1rem 1.6rem;
    border-bottom: 1px solid var(--line);
  }

  .modal-section-title {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    padding: 1rem 1.6rem 0.4rem;
  }

  .match-log { max-height: 320px; overflow-y: auto; padding: 0 1.6rem 1.4rem; }
  .match-row {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 0.7rem;
    padding: 0.55rem 0.2rem;
    border-bottom: 1px solid var(--line);
    font-size: 0.83rem;
  }
  .match-row:last-child { border-bottom: none; }
  .match-result {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink-faint);
  }
  .match-result.win { background: #3ee87a; box-shadow: 0 0 6px 1px #3ee87a88; }
  .match-result.loss { background: #ff6b6b; box-shadow: 0 0 6px 1px #ff6b6b88; }
  .match-mode { color: var(--ink); font-weight: 600; }
  .match-note { color: var(--ink-dim); font-size: 0.76rem; text-align: right; }
  .match-time { color: var(--ink-faint); font-size: 0.72rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .match-log-empty {
    color: var(--ink-dim);
    font-size: 0.85rem;
    text-align: center;
    padding: 1.5rem;
  }
  .match-log-loading {
    color: var(--ink-faint);
    font-size: 0.82rem;
    text-align: center;
    padding: 1.5rem;
  }

  @media (max-width: 480px) {
    .card { grid-template-columns: 2rem 1fr auto; padding: 0.85rem 0.9rem 0.85rem 1.1rem; }
    .modes { padding-left: 0; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .search { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow"><span class="pip"></span>Live Rankings</div>
  <h1>PVPTRIALS <span class="glow">Rankings</span></h1>
  <p>Official Tierlist for PVP: TRIALS</p>
</header>

<main>
  <div class="toolbar">

      <input class="search" id="search" type="text" placeholder="Find a player…">
    </div>
  </div>
  <div id="board"></div>
</main>

<footer>PVPTRIALS · community-run tier tracker</footer>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <button class="modal-close" id="modalClose" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div style="display:flex; align-items:center; gap:0.9rem; margin-bottom:0.9rem;">
        <img id="modalAvatar" class="avatar" style="width:52px;height:52px;border-radius:9px;" src="" alt="">
        <div>
          <h2 id="modalNick" style="margin:0;"></h2>
          <div class="title-line" id="modalTitle" style="margin-top:0.2rem; font-size:0.8rem;"></div>
        </div>
      </div>
      <div class="modal-general" id="modalGeneral"></div>
    </div>
    <div class="stat-row" id="modalStats"></div>
    <div class="modal-modes" id="modalModes"></div>
    <div class="modal-section-title">Recent matches</div>
    <div class="match-log" id="matchLog"><div class="match-log-loading">Loading match history…</div></div>
  </div>
</div>

const MODE_ORDER = ["Sword", "Axe", "Mace", "UHC", "NethPot", "Pot", "SMP", "Vanilla"];
const TIER_COLOR = { "1": "var(--t1)", "2": "var(--t2)", "3": "var(--t3)", "4": "var(--t4)", "5": "var(--t5)" };
const SUB_ORDER = { H: 0, M: 1, L: 2 };

// Mirrors Code/config.py TITLES exactly (name, points needed, base RGB, gold_mix)
const TITLES = [
  { name: "Combat Grandmaster", need: 400, color: [255, 208, 64], mix: 0 },
  { name: "Combat Master",      need: 250, color: [255, 96, 110], mix: 0.35 },
  { name: "Combat Ace",         need: 100, color: [255, 96, 110], mix: 0 },
  { name: "Combat Specialist",  need: 50,  color: [176, 96, 255], mix: 0 },
  { name: "Combat Cadet",       need: 20,  color: [196, 140, 255], mix: 0 },
  { name: "Combat Novice",      need: 10,  color: [214, 176, 255], mix: 0 },
  { name: "Rookie",             need: 0,   color: [140, 150, 184], mix: 0 },
];
const GOLD_RGB = TITLES[0].color;

function titleFor(points) {
  for (const t of TITLES) {
    if (points >= t.need) {
      let [r, g, b] = t.color;
      if (t.mix) {
        r = Math.round(r + (GOLD_RGB[0] - r) * t.mix);
        g = Math.round(g + (GOLD_RGB[1] - g) * t.mix);
        b = Math.round(b + (GOLD_RGB[2] - b) * t.mix);
      }
      return { name: t.name, color: `rgb(${r},${g},${b})` };
    }
  }
  const last = TITLES[TITLES.length - 1];
  return { name: last.name, color: `rgb(${last.color.join(",")})` };
}

function avatarUrl(nick) {
  return `https://mc-heads.net/avatar/${encodeURIComponent(nick)}/64`;
}

// __MODE_ICONS_DATA__ is injected below as a {ModeName: "data:image/png;base64,..."} object

let players = [];
let playerModes = [];
let client = null;
let searchTerm = "";
const configured = !SUPABASE_URL.includes("YOUR-PROJECT-REF");

function tierColor(tier) {
  if (!tier) return "var(--ink-faint)";
  return TIER_COLOR[tier.slice(-1)] || "var(--ink-faint)";
}

function tierSortKey(tier) {
  if (!tier) return [9, 9];
  const level = parseInt(tier.slice(-1), 10);
  const sub = SUB_ORDER[tier[0]] ?? 3;
  return [level, sub];
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderBoard() {
  const board = document.getElementById("board");
  let rows = players.filter(p => p.general_tier);

  if (searchTerm) {
    rows = rows.filter(p => p.nick.toLowerCase().includes(searchTerm));
  }

  if (rows.length === 0) {
    board.innerHTML = `<div class="empty">${
      searchTerm ? `No player matching <strong>"${escapeHtml(searchTerm)}"</strong>.`
      : `No one is ranked yet.<br><br>Once a club member's app pushes a result, they'll show up here automatically.`
    }</div>`;
    return;
  }

  rows.sort((a, b) => {
    const [la, sa] = tierSortKey(a.general_tier), [lb, sb] = tierSortKey(b.general_tier);
    if (la !== lb) return la - lb;
    if (sa !== sb) return sa - sb;
    return b.total_points - a.total_points;
  });

  board.innerHTML = "";
  rows.forEach((p, i) => {
    const modesForPlayer = playerModes.filter(pm => pm.nick === p.nick);
    const badges = MODE_ORDER.map(mode => {
      const pm = modesForPlayer.find(x => x.mode === mode);
      const tier = pm && pm.tier;
      const cls = tier ? "" : " unranked";
      const iconSrc = MODE_ICONS_DATA[mode] || "";
      return `<div class="mode-badge${cls}" style="--badge-color:${tierColor(tier)}">
        <img src="${iconSrc}" alt="${mode}" class="mode-icon-img">
        ${tier ? `<span class="mode-tier-tag">${tier}</span>` : ""}
        <span class="tt">${mode}: ${tier || "Unranked"}</span>
      </div>`;
    }).join("");

    const rankCls = i === 0 ? " r1" : i === 1 ? " r2" : i === 2 ? " r3" : "";
    const title = titleFor(p.total_points);

    const card = document.createElement("div");
    card.className = "card";
    card.dataset.nick = p.nick;
    card.style.setProperty("--tier-color", tierColor(p.general_tier));
    card.innerHTML = `
      <div class="rank-block${rankCls}">${i + 1}</div>
      <img class="avatar" src="${avatarUrl(p.nick)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="identity">
        <div class="nick">${escapeHtml(p.nick)}</div>
        <div class="title-line" style="--title-color:${title.color}">${title.name} <span class="pts-inline">· ${p.total_points} pts</span></div>
      </div>
      <div class="modes-row">${badges}</div>`;
    card.addEventListener("click", () => openProfile(p.nick));
    board.appendChild(card);
  });
}

function flashRow(nick) {
  const el = document.querySelector(`[data-nick="${CSS.escape(nick)}"]`);
  if (el) {
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 1000);
  }
}

async function loadData() {
  const [{ data: p }, { data: pm }] = await Promise.all([
    client.from("players").select("*"),
    client.from("player_modes").select("*"),
  ]);
  players = p || [];
  playerModes = pm || [];
  renderBoard();
}

document.getElementById("search").addEventListener("input", (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  renderBoard();
});

// ---------------- profile modal ----------------
const modalBackdrop = document.getElementById("modalBackdrop");
const matchLogEl = document.getElementById("matchLog");

function timeAgo(iso) {
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 30) return `${days}d ago`;
  return new Date(iso).toLocaleDateString();
}

function matchKindLabel(row) {
  if (row.match_kind === "test") return row.won ? `Tier test win${row.target ? " → " + row.target : ""}` : "Tier test loss";
  if (row.match_kind === "sub") return row.won ? "Sub match win" : "Sub match loss";
  if (row.match_kind === "duel_ranked") return "Ranked duel";
  return row.note || (row.won ? "Win" : "Loss");
}

function renderModes(p) {
  const modesForPlayer = playerModes.filter(pm => pm.nick === p.nick);
  return MODE_ORDER.map(mode => {
    const pm = modesForPlayer.find(x => x.mode === mode);
    const tier = pm && pm.tier;
    const cls = tier ? "" : " unranked";
    const iconSrc = MODE_ICONS_DATA[mode] || "";
    return `<div class="chip${cls}" style="--chip-color:${tierColor(tier)}">
      <img src="${iconSrc}" alt="" style="width:14px;height:14px;object-fit:contain;${tier ? "" : "filter:grayscale(1);opacity:0.6;"}">
      <span class="mode-name">${mode}</span>
      <span class="mode-tier">${tier || "—"}</span>
    </div>`;
  }).join("");
}

async function openProfile(nick) {
  const p = players.find(x => x.nick === nick);
  if (!p) return;

  document.getElementById("modalNick").textContent = nick;
  document.getElementById("modalAvatar").src = avatarUrl(nick);
  const titleInfo = titleFor(p.total_points);
  const titleEl = document.getElementById("modalTitle");
  titleEl.textContent = titleInfo.name;
  titleEl.style.setProperty("--title-color", titleInfo.color);
  const generalEl = document.getElementById("modalGeneral");
  generalEl.style.setProperty("--tier-color", tierColor(p.general_tier));
  generalEl.innerHTML = `${p.general_tier}<span class="pts">${p.total_points} pts</span>`;
  document.getElementById("modalModes").innerHTML = renderModes(p);
  document.getElementById("modalStats").innerHTML = `
    <div class="stat"><div class="num">—</div><div class="lbl">Win rate</div></div>
    <div class="stat"><div class="num good">—</div><div class="lbl">Wins</div></div>
    <div class="stat"><div class="num bad">—</div><div class="lbl">Losses</div></div>`;
  matchLogEl.innerHTML = `<div class="match-log-loading">Loading match history…</div>`;

  modalBackdrop.classList.add("open");
  document.body.style.overflow = "hidden";

  if (!configured || !client) return;

  const { data, error } = await client
    .from("match_history")
    .select("*")
    .eq("nick", nick)
    .order("played_at", { ascending: false })
    .limit(100);

  if (error || !data) {
    matchLogEl.innerHTML = `<div class="match-log-empty">Couldn't load match history.</div>`;
    return;
  }

  if (data.length === 0) {
    matchLogEl.innerHTML = `<div class="match-log-empty">No recorded matches yet.</div>`;
  } else {
    const wins = data.filter(r => r.won).length;
    const losses = data.length - wins;
    const winRate = data.length ? Math.round((wins / data.length) * 100) : 0;
    document.getElementById("modalStats").innerHTML = `
      <div class="stat"><div class="num">${winRate}%</div><div class="lbl">Win rate</div></div>
      <div class="stat"><div class="num good">${wins}</div><div class="lbl">Wins</div></div>
      <div class="stat"><div class="num bad">${losses}</div><div class="lbl">Losses</div></div>`;

    matchLogEl.innerHTML = data.map(row => `
      <div class="match-row">
        <div class="match-result ${row.won ? "win" : "loss"}"></div>
        <div class="match-mode">${escapeHtml(row.mode || "")}</div>
        <div class="match-note">${escapeHtml(matchKindLabel(row))}</div>
        <div class="match-time">${timeAgo(row.played_at)}</div>
      </div>`).join("");
  }
}

function closeProfile() {
  modalBackdrop.classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("modalClose").addEventListener("click", closeProfile);
modalBackdrop.addEventListener("click", (e) => { if (e.target === modalBackdrop) closeProfile(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeProfile(); });

async function init() {
  if (!configured) {
    document.getElementById("statusText").textContent =
      "not connected — add your Supabase URL and key in index.html";
    document.querySelector(".dot").style.background = "#6b7d99";
    renderBoard();
    return;
  }
  client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  await loadData();
  document.getElementById("statusText").textContent = "live";

  client.channel("public:players")
    .on("postgres_changes", { event: "*", schema: "public", table: "players" }, async (payload) => {
      await loadData();
      const nick = payload.new?.nick || payload.old?.nick;
      if (nick) flashRow(nick);
    })
    .subscribe();

  client.channel("public:player_modes")
    .on("postgres_changes", { event: "*", schema: "public", table: "player_modes" }, async (payload) => {
      await loadData();
      const nick = payload.new?.nick || payload.old?.nick;
      if (nick) flashRow(nick);
    })
    .subscribe();
}

init();
</script>
</body>
</html>
